<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#F0CE6A"/>
      <stop offset="50%"  stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#B8962A"/>
    </linearGradient>
  </defs>
  <!-- Red oval background -->
  <ellipse cx="32" cy="32" rx="31" ry="31" fill="#C41230"/>
  <!-- Gold ring border -->
  <ellipse cx="32" cy="32" rx="31" ry="31" fill="none" stroke="url(#g)" stroke-width="3"/>
  <!-- V letter -->
  <text
    x="32" y="46"
    text-anchor="middle"
    fill="white"
    font-family="Georgia, 'Playfair Display', serif"
    font-size="36"
    font-weight="900"
    letter-spacing="1"
  >V</text>
</svg>
