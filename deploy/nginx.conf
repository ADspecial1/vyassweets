# Nginx config for Vyas Sweets
# Place at: /etc/nginx/sites-available/vyassweets
# Enable: sudo ln -s /etc/nginx/sites-available/vyassweets /etc/nginx/sites-enabled/vyassweets
# Test:   sudo nginx -t
# Reload: sudo systemctl reload nginx

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name vyassweets.duckdns.org 13.201.117.48;
    return 301 https://$host$request_uri;
}

# Main HTTPS server
server {
    listen 443 ssl;
    server_name vyassweets.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/vyassweets.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vyassweets.duckdns.org/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Serve the React frontend (built files in client/dist)
    root /home/ubuntu/sweets-app/client/dist;
    index index.html;

    # Gzip for faster page loads
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Cache static assets 30 days, never cache index.html
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Proxy /api/* requests to Express backend on port 5000
    location /api/ {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Increase timeout for file uploads
        proxy_read_timeout 60s;
        client_max_body_size 10M;
    }

    # React Router — serve index.html for all other routes (SPA fallback)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
