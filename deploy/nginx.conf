# Nginx reverse proxy config for Vyas Sweets API
# Place this file at: /etc/nginx/sites-available/vyassweets
# Then: sudo ln -s /etc/nginx/sites-available/vyassweets /etc/nginx/sites-enabled/
#
# Replace YOUR_DOMAIN below with your actual domain or DuckDNS subdomain
# e.g. vyassweets.duckdns.org

server {
    listen 80;
    server_name YOUR_DOMAIN;

    # Redirect HTTP to HTTPS (uncomment after running certbot)
    # return 301 https://$host$request_uri;

    # --- Temporary: serve without SSL for initial testing ---
    location /api/ {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

